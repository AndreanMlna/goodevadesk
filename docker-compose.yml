services:
  # ==============================================================================
  # Database: PostgreSQL 16
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: goodevadesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goodeva_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goodeva_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-goodevadesk_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goodeva_user} -d ${POSTGRES_DB:-goodevadesk_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goodevadesk-net

  # ==============================================================================
  # Cache: Redis 7
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: goodevadesk_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goodevadesk-net

  # ==============================================================================
  # Backend: NestJS API (Prisma + LLM Integration + Multi-Tenancy)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goodevadesk_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-goodeva_user}:${POSTGRES_PASSWORD:-goodeva_secret_2026}@postgres:5432/${POSTGRES_DB:-goodevadesk_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_TTL_SECONDS: 86400
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      PYTHON_NLP_SERVICE_URL: http://python-nlp:8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "3000:3000"
    networks:
      - goodevadesk-net

  # ==============================================================================
  # Bonus NLP Microservice: Python FastAPI
  # ==============================================================================
  python-nlp:
    build:
      context: ./python-nlp
      dockerfile: Dockerfile
    container_name: goodevadesk_python_nlp
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - goodevadesk-net

  # ==============================================================================
  # Frontend: React 19 + TypeScript + Vite Agent Dashboard
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goodevadesk_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - goodevadesk-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  goodevadesk-net:
    driver: bridge
