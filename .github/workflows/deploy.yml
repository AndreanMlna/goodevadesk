name: CD / Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push-images:
    name: Build & Package Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: goodevadesk/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python NLP Image
        uses: docker/build-push-action@v5
        with:
          context: ./python-nlp
          push: false
          tags: goodevadesk/python-nlp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: goodevadesk/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
